name: Verify App Store Edition
on:
  push:
    branches: [main]
    paths: ['Sources/ShowMacStore/**', 'StoreResources/**', 'scripts/*store*', 'scripts/bundle-swift-runtime.py', 'Package.swift', '.github/workflows/store-build.yml']
  pull_request:
    paths: ['Sources/ShowMacStore/**', 'StoreResources/**', 'scripts/*store*', 'Package.swift', '.github/workflows/store-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    name: Sandboxed Store build (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SHOWMAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build independent sandbox edition
        run: |
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          bash scripts/build-store.sh build/store/ShowMac.app
      - name: Verify native public readings
        run: |
          if [[ "$(uname -m)" == "$SHOWMAC_ARCH" ]]; then
            build/store/ShowMac.app/Contents/MacOS/ShowMacStore --self-check
          fi
      - name: Package validation artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/store/ShowMac.app "build/ShowMac-Store-validation-$SHOWMAC_ARCH.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-validation-${{ matrix.arch }}
          path: build/ShowMac-Store-validation-*.zip
          retention-days: 14
          if-no-files-found: error
