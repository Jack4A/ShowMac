# IP TLS endpoint. Existing default proxy routes are preserved below.
server {
    listen 443 ssl http2 default_server;
    server_name 101.37.211.18;
    include /etc/nginx/snippets/showmac.conf;
    ssl_certificate /srv/showmac/acme-config/live/showmac-ip/fullchain.pem;
    ssl_certificate_key /srv/showmac/acme-config/live/showmac-ip/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
