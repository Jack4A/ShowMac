# Include only in the IP HTTP server block. Existing sites keep their routes.
location = /showmac { return 301 /showmac/; }
location ^~ /showmac/ {
    alias /srv/showmac/current/;
    index index.html;
    autoindex off;
    access_log /var/log/showmac/access.log;
    error_log /var/log/showmac/error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cache-Control no-cache always;
}
