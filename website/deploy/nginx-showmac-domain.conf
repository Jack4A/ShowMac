# Canonical domain, separate from the existing IP and unrelated vhosts.
server {
    listen 80;
    server_name show-mac.cc www.show-mac.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/showmac/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://show-mac.cc$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.show-mac.cc;
    ssl_certificate /srv/showmac/acme-config/live/showmac-domain/fullchain.pem;
    ssl_certificate_key /srv/showmac/acme-config/live/showmac-domain/privkey.pem;
    return 301 https://show-mac.cc$request_uri;
}
server {
    listen 443 ssl http2;
    server_name show-mac.cc;
    ssl_certificate /srv/showmac/acme-config/live/showmac-domain/fullchain.pem;
    ssl_certificate_key /srv/showmac/acme-config/live/showmac-domain/privkey.pem;
    root /srv/showmac/current;
    index index.html;
    autoindex off;
    access_log /var/log/showmac/access.log;
    error_log /var/log/showmac/error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cache-Control no-cache always;
    location = / { return 302 /$showmac_language/$is_args$args; }
    location = /support/ { return 302 /$showmac_language/support/$is_args$args; }
    location = /privacy/ { return 302 /$showmac_language/privacy/$is_args$args; }
    location = /showmac { return 301 /; }
    location /showmac/ { rewrite ^/showmac/(.*)$ /$1 permanent; }
    location = /locale.json {
        default_type application/json;
        return 200 '{"language":"$showmac_language","country":"$showmac_country"}';
    }
    location / { try_files $uri $uri/ =404; }
}
