# http-level configuration; uses the existing ngx_http_geoip2_module.
# DB-IP Country Lite, CC BY 4.0: https://db-ip.com/db/lite.php
# Look up the actual TCP peer. Public forwarding headers are not trusted.
geoip2 /srv/showmac/geoip/country.mmdb {
    auto_reload 1h;
    $showmac_country country iso_code;
}
map $http_accept_language $showmac_browser_language {
    default en;
    ~*^zh zh;
}
map $showmac_country $showmac_region_language {
    default en;
    "" $showmac_browser_language;
    CN zh;
    HK zh;
    MO zh;
    TW zh;
}
map $cookie_showmac_language $showmac_language {
    default $showmac_region_language;
    en en;
    zh zh;
}
