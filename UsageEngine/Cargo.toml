[package]
name = "showmac-usage-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }
tokscale-core = { path = "../Vendor/tokscale/crates/tokscale-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
panic = "abort"
